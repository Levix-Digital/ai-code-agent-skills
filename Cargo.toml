[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
terminal_size = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-normalization = "0.1"
kernel = { path = "crates/kernel" }
architecture-docs = { path = "crates/architecture-docs" }
product-inception = { path = "crates/product-inception" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
