# Tests on every pull request into main and every push to main (trunk model).
# The Rust workspace holds the engine and its tests; the parity harness proves that every command
# still gives the results recorded from the Python scripts it was translated from (IMP-005, ADR-0007).
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per pull request (superseded runs are cancelled); one per commit otherwise.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Engine version bumped with the engine
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          if ! git diff --quiet "$base"...HEAD -- crates Cargo.toml Cargo.lock rust-toolchain.toml product-inception/templates plan-memory/templates/ROADMAP_TEMPLATE.md \
             && git diff --quiet "$base"...HEAD -- dev-cycle-protocol/bin/engine-version; then
            echo "::error::The engine changed: bump dev-cycle-protocol/bin/engine-version and the workspace version in Cargo.toml"
            exit 1
          fi
      - name: Run linters
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build the engine
        run: cargo build -p dev-cycle
      - name: Fetch the embedding model
        # The engine downloads it into ~/.cache/chroma on first use; the parity cases of the
        # search indexes copy it into each run's home.
        shell: bash
        env:
          PLAN_MEMORY_DB: ${{ runner.temp }}/plan-index
        run: target/debug/dev-cycle plan-memory rebuild_index
      - name: Run the Rust tests
        run: cargo test --workspace
      - name: Compare with the golden files (parity)
        run: cargo run -p parity -- run
      - name: Launcher (sh)
        shell: bash
        run: dev-cycle-protocol/bin/dev-cycle --version
      - name: Launcher (PowerShell)
        shell: pwsh
        run: ./dev-cycle-protocol/bin/dev-cycle.ps1 --version
