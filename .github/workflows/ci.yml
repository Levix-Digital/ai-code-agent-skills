# Tests on every pull request into main and every push to main (trunk model).
# The Python suites test the skills' scripts; the Rust workspace holds their translations, and the
# parity harness proves that both give the same results (IMP-005, ADR-0007).
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per pull request (superseded runs are cancelled); one per commit otherwise.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run linters
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
      - name: Install the Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run the Rust tests
        run: cargo test --workspace
      - name: Compare Python and Rust (parity)
        env:
          PARITY_PYTHON: python
        run: |
          cargo build -p dev-cycle
          cargo run -p parity -- run
      - name: Run the Python tests
        run: python -m pytest
