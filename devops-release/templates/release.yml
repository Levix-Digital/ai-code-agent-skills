# Release workflow: builds and publishes a release for a version tag.
# - vX.Y.Z-rc.N tags (pushed by the agent from the integration branch) publish a PRE-RELEASE.
# - vX.Y.Z final tags are created by tag-on-merge.yml, which calls this workflow directly
#   (a tag pushed with GITHUB_TOKEN would not trigger it).
name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Build, test and package the release assets into dist/ here.

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Set repository and token when releases are published to a separate repository.
          # repository: org/app-releases
          # token: ${{ secrets.RELEASES_PAT }}
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-rc') }}
          make_latest: ${{ !contains(env.TAG, '-rc') }}
          generate_release_notes: true
          files: dist/*
